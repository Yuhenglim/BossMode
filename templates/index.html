<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BossMode</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="app-body">

<div class="app-layout">

    <!-- ── Sidebar ─────────────────────────────────────────── -->
    <div class="sidebar">

        <div class="sidebar-header">
            <div class="brand">
                <div class="brand-dot"></div>
                <span class="brand-name">BossMode</span>
            </div>
            <div style="display:flex; gap:6px;">
                <a href="/dashboard" class="btn btn-ghost" style="font-size:0.8rem; padding:6px 12px;">📊</a>
                <a href="/logout" class="btn btn-ghost" style="font-size:0.8rem; padding:6px 12px;">Log out</a>
            </div>
        </div>

        <div class="sidebar-actions">
            <button class="action-box" onclick="openPanel('character')">
                <div class="action-icon">👤</div>
                <div class="action-label">New Character</div>
            </button>
            <button class="action-box" onclick="openPanel('task')">
                <div class="action-icon">📋</div>
                <div class="action-label">New Task</div>
            </button>
        </div>

        <div class="sidebar-divider"></div>

        <div class="chat-list" id="chat-list">
            <!-- Example placeholder -->
            <div class="chat-row example-row" id="example-row">
                <div class="chat-avatar example-avatar">🎭</div>
                <div class="chat-info">
                    <div class="chat-name" style="color:var(--text-dim);">Karina <span class="example-badge">example</span></div>
                    <div class="chat-preview">Create a character to get started...</div>
                </div>
            </div>
        </div>

        <div class="sidebar-footer">
            <div class="user-pill">
                <div class="user-avatar">{{ user.name[0].upper() }}</div>
                <div class="user-info">
                    <div class="user-name">{{ user.name }}</div>
                    <div class="user-email">{{ user.email }}</div>
                </div>
            </div>
        </div>

    </div>

    <!-- ── Main area ───────────────────────────────────────── -->
    <div class="sidebar-overlay" id="sidebar-overlay" onclick="closeSidebar()"></div>
    <div class="main-area">
        <div class="mobile-topbar">
            <button class="hamburger" onclick="toggleSidebar()">☰</button>
            <div class="brand" style="position:absolute; left:50%; transform:translateX(-50%);">
                <div class="brand-dot"></div>
                <span class="brand-name">BossMode</span>
            </div>
        </div>

        <!-- Empty state -->
        <div class="main-empty" id="main-empty">
            <div class="main-empty-icon">💬</div>
            <div class="main-empty-title">Select a character to start chatting</div>
            <div class="main-empty-sub">Or create a new one using the sidebar</div>
        </div>

        <!-- Chat view (hidden until character selected) -->
        <div class="chat-view" id="chat-view" style="display:none;">

            <div class="chat-view-header" id="chat-view-header">
                <!-- filled dynamically -->
            </div>

            <div class="task-tabs" id="task-tabs">
                <!-- task tabs filled dynamically -->
            </div>

            <div class="chat-messages" id="chat-messages">
                <div class="empty-state" id="msg-empty">
                    <div class="icon">💬</div>
                    <p>No messages yet. Get one below.</p>
                </div>
            </div>

            <div class="chat-input-area" id="chat-input-area">
                <input type="text" id="user-input" class="chat-input"
                    placeholder="Reply to your boss..."
                    onkeydown="if(event.key==='Enter') sendReply()">
                <button class="btn btn-primary" onclick="sendReply()">Send</button>
                <button class="btn btn-ghost" onclick="getAutoMessage()" id="auto-btn">
                    📩 Prompt
                </button>
            </div>

        </div>

    </div>

    <!-- ── Right panel (slides in) ────────────────────────── -->
    <div class="panel-backdrop" id="panel-backdrop" onclick="closePanel()"></div>

    <div class="side-panel" id="side-panel">

        <!-- Character creation panel -->
        <div id="panel-character" style="display:none;">
            <div class="panel-header">
                <div class="panel-title">New Character</div>
                <button class="panel-close" onclick="closePanel()">✕</button>
            </div>
            <div class="panel-body">
                <div class="form-group">
                    <label>Name</label>
                    <input type="text" id="c-name" placeholder="e.g. Mr. Tan">
                </div>
                <div class="form-group">
                    <label>Role</label>
                    <input type="text" id="c-role" placeholder="e.g. Boss, Lecturer, Parent">
                </div>
                <div class="form-group">
                    <label>Personality</label>
                    <textarea id="c-personality" rows="4"
                        placeholder="e.g. Extremely demanding, no patience for excuses, speaks in short sharp sentences"></textarea>
                </div>
                <div class="form-group">
                    <label>Picture URL (optional)</label>
                    <input type="text" id="c-picture"
                        placeholder="https://api.dicebear.com/7.x/avataaars/svg?seed=name">
                </div>
                <button class="btn btn-primary" style="width:100%;" onclick="createCharacter()">
                    Create Character
                </button>
            </div>
        </div>

        <!-- Task creation panel -->
        <div id="panel-task" style="display:none;">
            <div class="panel-header">
                <div class="panel-title">New Task</div>
                <button class="panel-close" onclick="closePanel()">✕</button>
            </div>
            <div class="panel-body">
                <div class="form-group">
                    <label>Assign to</label>
                    <div class="character-selector" id="character-selector">
                        <!-- filled dynamically -->
                    </div>
                </div>
                <div class="form-group">
                    <label>Task Name</label>
                    <input type="text" id="t-name" placeholder="e.g. Finish assignment">
                </div>
                <div class="form-group">
                    <label>Description</label>
                    <textarea id="t-description" rows="3"
                        placeholder="e.g. Complete chapters 3 and 4 and submit on the portal"></textarea>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>Deadline</label>
                        <input type="date" id="t-deadline">
                    </div>
                    <div class="form-group">
                        <label>Messages/day</label>
                        <select id="t-mpd">
                            <option value="1">1 — light</option>
                            <option value="2">2 — moderate</option>
                            <option value="3" selected>3 — default</option>
                            <option value="4">4 — persistent</option>
                            <option value="6">6 — relentless</option>
                        </select>
                    </div>
                </div>
                <button class="btn btn-primary" style="width:100%;" onclick="createTask()">
                    Add Task
                </button>
            </div>
        </div>

    </div>

</div>

<!-- Notification -->
<div class="notification" id="notification">
    <div class="notification-name" id="notification-name"></div>
    <div class="notification-text" id="notification-text"></div>
</div>

<script>
    // ── State ──────────────────────────────────────────────────────
let characters   = [];
let activeCharId = null;
let activeTaskId = null;
let lastMsgCount = 0;
let editingCharId = null;
let editingTaskId = null;
window._allTasks  = [];

// ── Init ───────────────────────────────────────────────────────
loadCharacters();
setInterval(poll, 30000);

// ── Load characters ────────────────────────────────────────────
async function loadCharacters() {
    const res  = await fetch("/api/characters");
    const data = await res.json();
    characters = data.characters;
    renderChatList();
}

function renderChatList() {
    const list    = document.getElementById("chat-list");
    const example = document.getElementById("example-row");

    list.querySelectorAll(".chat-row:not(.example-row)").forEach(r => r.remove());

    if (characters.length === 0) {
        example.style.display = "flex";
        return;
    }

    example.style.display = "none";

    characters.forEach(c => {
        const row = document.createElement("div");
        row.className = "chat-row";
        row.id = `chat-row-${c.id}`;
        row.onclick = () => selectCharacter(c.id);
        row.oncontextmenu = (e) => { e.preventDefault(); showContextMenu(e, c); };

        const avatarContent = c.picture
            ? `<img src="${c.picture}" alt="${c.name}">`
            : c.name[0].toUpperCase();

        row.innerHTML = `
            <div class="chat-avatar">${avatarContent}</div>
            <div class="chat-info">
                <div class="chat-name">${c.name}</div>
                <div class="chat-preview chat-role">${c.role}</div>
            </div>
            <div class="chat-row-actions">
                <button class="row-action-btn" onclick="event.stopPropagation(); showContextMenu(event, ${JSON.stringify(c).replace(/"/g, '&quot;')})">⋯</button>
            </div>
        `;
        list.appendChild(row);
    });
}

// ── Context menu ───────────────────────────────────────────────
function showContextMenu(e, character) {
    removeContextMenu();
    const menu = document.createElement("div");
    menu.className = "context-menu";
    menu.id = "context-menu";
    menu.style.top  = `${e.clientY}px`;
    menu.style.left = `${e.clientX}px`;
    menu.innerHTML = `
        <div class="context-item" onclick="viewProfile(${character.id})">👤 View Profile</div>
        <div class="context-item" onclick="openEditCharacter(${character.id})">✏️ Edit</div>
        <div class="context-divider"></div>
        <div class="context-item context-danger" onclick="confirmDeleteCharacter(${character.id}, '${character.name}')">🗑️ Delete</div>
    `;
    document.body.appendChild(menu);
    setTimeout(() => document.addEventListener("click", removeContextMenu, { once: true }), 10);
}

function removeContextMenu() {
    const m = document.getElementById("context-menu");
    if (m) m.remove();
}

function viewProfile(charId) {
    window.location.href = `/characters/${charId}`;
}

// ── Edit character ─────────────────────────────────────────────
function openEditCharacter(charId) {
    removeContextMenu();
    const char = characters.find(c => c.id === charId);
    if (!char) return;

    editingCharId = charId;

    document.getElementById("panel-character").style.display  = "block";
    document.getElementById("panel-task").style.display       = "none";
    document.getElementById("side-panel").classList.add("open");
    document.getElementById("panel-backdrop").classList.add("open");

    // Pre-fill form
    document.getElementById("c-name").value        = char.name;
    document.getElementById("c-role").value        = char.role;
    document.getElementById("c-personality").value = char.personality;
    document.getElementById("c-picture").value     = char.picture || "";

    // Change button text
    document.querySelector("#panel-character .btn-primary").textContent = "Save Changes";
    document.querySelector("#panel-character .btn-primary").onclick = saveCharacter;
    document.querySelector(".panel-title").textContent = "Edit Character";

    // ── Mobile sidebar ─────────────────────────────────────────
    function toggleSidebar() {
        const sidebar  = document.querySelector(".sidebar");
        const overlay  = document.getElementById("sidebar-overlay");
        const isOpen   = sidebar.classList.contains("mobile-open");
        if (isOpen) closeSidebar();
        else {
            sidebar.classList.add("mobile-open");
            overlay.classList.add("open");
        }
    }

    function closeSidebar() {
        document.querySelector(".sidebar").classList.remove("mobile-open");
        document.getElementById("sidebar-overlay").classList.remove("open");
    }
}

async function saveCharacter() {
    const name        = document.getElementById("c-name").value.trim();
    const role        = document.getElementById("c-role").value.trim();
    const personality = document.getElementById("c-personality").value.trim();
    const picture     = document.getElementById("c-picture").value.trim();

    if (!name || !role || !personality) { alert("All fields required."); return; }

    const res = await fetch(`/api/characters/${editingCharId}`, {
        method: "PATCH",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ name, role, personality, picture })
    });

    if (!res.ok) { alert("Something went wrong."); return; }

    editingCharId = null;
    closePanel();
    await loadCharacters();
    selectCharacter(activeCharId);
}

// ── Delete character ───────────────────────────────────────────
function confirmDeleteCharacter(charId, name) {
    removeContextMenu();
    if (!confirm(`Delete "${name}" and all their tasks? This cannot be undone.`)) return;
    deleteCharacter(charId);
}

async function deleteCharacter(charId) {
    const res = await fetch(`/api/characters/${charId}`, { method: "DELETE" });
    if (res.ok) {
        if (activeCharId === charId) {
            activeCharId = null;
            activeTaskId = null;
            document.getElementById("main-empty").style.display = "flex";
            document.getElementById("chat-view").style.display  = "none";
        }
        await loadCharacters();
    }
}

// ── Select character ───────────────────────────────────────────
async function selectCharacter(charId) {
    closeSidebar();
    activeCharId = charId;
    activeTaskId = null;

    document.querySelectorAll(".chat-row").forEach(r => r.classList.remove("active"));
    const row = document.getElementById(`chat-row-${charId}`);
    if (row) row.classList.add("active");

    document.getElementById("main-empty").style.display = "none";
    document.getElementById("chat-view").style.display  = "flex";

    const char = characters.find(c => c.id === charId);

    const avatarContent = char.picture
        ? `<img src="${char.picture}" alt="${char.name}">`
        : char.name[0].toUpperCase();

    document.getElementById("chat-view-header").innerHTML = `
        <div class="chat-avatar" style="width:40px;height:40px;font-size:1rem;cursor:pointer;"
            onclick="viewProfile(${char.id})">${avatarContent}</div>
        <div class="chat-header-info" style="cursor:pointer;" onclick="viewProfile(${char.id})">
            <div class="chat-header-name">${char.name}</div>
            <div class="chat-header-task">${char.role}</div>
        </div>
        <button class="btn btn-ghost" style="font-size:0.8rem; padding:6px 12px;"
            onclick="openEditCharacter(${char.id})">✏️ Edit</button>
    `;

    const res  = await fetch(`/api/characters/${charId}/tasks`);
    const data = await res.json();
    window._allTasks = data.tasks;
    renderTaskTabs(data.tasks);

    const firstTask = data.tasks.find(t => !t.is_complete) || data.tasks[0];
    if (firstTask) selectTask(firstTask.id);
    else clearMessages();
}

// ── Task tabs ──────────────────────────────────────────────────
function renderTaskTabs(tasks) {
    const tabs = document.getElementById("task-tabs");
    tabs.innerHTML = "";

    if (tasks.length === 0) {
        tabs.innerHTML = `<div style="padding:10px 16px; font-size:0.8rem; color:var(--text-dim);">
            No tasks yet — add one from the sidebar.</div>`;
        return;
    }

    tasks.forEach(t => {
        const tab = document.createElement("button");
        tab.className = `task-tab${t.is_complete ? " task-tab-done" : ""}`;
        tab.id = `tab-${t.id}`;

        const wrapper = document.createElement("div");
        wrapper.style.cssText = "display:flex; align-items:center; gap:6px;";

        const label = document.createElement("span");
        label.textContent = t.name;
        label.onclick = () => selectTask(t.id);

        const menuBtn = document.createElement("span");
        menuBtn.textContent = "⋯";
        menuBtn.style.cssText = "font-size:0.85rem; opacity:0.6; cursor:pointer; padding:0 2px;";
        menuBtn.onclick = (e) => { e.stopPropagation(); showTaskContextMenu(e, t); };

        wrapper.appendChild(label);
        wrapper.appendChild(menuBtn);
        tab.appendChild(wrapper);
        tab.onclick = () => selectTask(t.id);
        tabs.appendChild(tab);
    });
}

// ── Task context menu ──────────────────────────────────────────
function showTaskContextMenu(e, task) {
    removeContextMenu();
    const menu = document.createElement("div");
    menu.className = "context-menu";
    menu.id = "context-menu";
    menu.style.top  = `${e.clientY}px`;
    menu.style.left = `${e.clientX}px`;
    menu.innerHTML = `
        <div class="context-item" onclick="openEditTask(${task.id})">✏️ Edit Task</div>
        <div class="context-divider"></div>
        <div class="context-item context-danger" onclick="confirmDeleteTask(${task.id}, '${task.name}')">🗑️ Delete Task</div>
    `;
    document.body.appendChild(menu);
    setTimeout(() => document.addEventListener("click", removeContextMenu, { once: true }), 10);
}

// ── Edit task ──────────────────────────────────────────────────
function openEditTask(taskId) {
    removeContextMenu();
    const task = window._allTasks.find(t => t.id === taskId);
    if (!task) return;

    editingTaskId = taskId;

    document.getElementById("panel-task").style.display      = "block";
    document.getElementById("panel-character").style.display = "none";
    document.getElementById("side-panel").classList.add("open");
    document.getElementById("panel-backdrop").classList.add("open");

    renderCharacterSelector();

    document.getElementById("t-name").value        = task.name;
    document.getElementById("t-description").value = task.description;
    document.getElementById("t-deadline").value    = task.deadline;
    document.getElementById("t-mpd").value         = task.messages_per_day;

    document.querySelector("#panel-task .btn-primary").textContent = "Save Changes";
    document.querySelector("#panel-task .btn-primary").onclick = saveTask;
    document.querySelector("#panel-task .panel-title") &&
        (document.querySelectorAll(".panel-title")[1].textContent = "Edit Task");
}

async function saveTask() {
    const name        = document.getElementById("t-name").value.trim();
    const description = document.getElementById("t-description").value.trim();
    const deadline    = document.getElementById("t-deadline").value;
    const mpd         = parseInt(document.getElementById("t-mpd").value);

    if (!name || !description || !deadline) { alert("All fields required."); return; }

    const res = await fetch(`/api/tasks/${editingTaskId}`, {
        method: "PATCH",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ name, description, deadline, messages_per_day: mpd })
    });

    if (!res.ok) { alert("Something went wrong."); return; }

    editingTaskId = null;
    closePanel();
    selectCharacter(activeCharId);
}

// ── Delete task ────────────────────────────────────────────────
function confirmDeleteTask(taskId, name) {
    removeContextMenu();
    if (!confirm(`Delete task "${name}"? This cannot be undone.`)) return;
    deleteTask(taskId);
}

async function deleteTask(taskId) {
    const res = await fetch(`/api/tasks/${taskId}`, { method: "DELETE" });
    if (res.ok) {
        if (activeTaskId === taskId) activeTaskId = null;
        selectCharacter(activeCharId);
    }
}

// ── Select task ────────────────────────────────────────────────
async function selectTask(taskId) {
    activeTaskId = taskId;
    lastMsgCount = 0;

    document.querySelectorAll(".task-tab").forEach(t => t.classList.remove("active"));
    const tab = document.getElementById(`tab-${taskId}`);
    if (tab) tab.classList.add("active");

    await loadHistory();

    const task = window._allTasks.find(t => t.id === taskId);
    const inputArea = document.getElementById("chat-input-area");

    if (task && task.is_complete) {
        inputArea.innerHTML = `
            <div style="width:100%; text-align:center; color:var(--text-dim); font-size:0.85rem; padding:8px;">
                Task complete — no more messages.
            </div>`;
    } else {
        inputArea.innerHTML = `
            <input type="text" id="user-input" class="chat-input"
                placeholder="Reply to your boss..."
                onkeydown="if(event.key==='Enter') sendReply()">
            <button class="btn btn-success btn-sm" onclick="markDone()">✓ Done</button>
            <button class="btn btn-primary btn-sm" onclick="sendReply()">Send</button>
            <button class="btn btn-ghost btn-sm" onclick="getAutoMessage()" id="auto-btn">📩 Prompt</button>
        `;
    }
}

// ── Load history ───────────────────────────────────────────────
async function loadHistory() {
    if (!activeTaskId) return;
    const res  = await fetch(`/api/tasks/${activeTaskId}/history`);
    const data = await res.json();

    const container = document.getElementById("chat-messages");
    container.innerHTML = "";

    if (data.history.length === 0) {
        container.innerHTML = `
            <div class="empty-state">
                <div class="icon">💬</div>
                <p>No messages yet. Hit Prompt to get your first one.</p>
            </div>`;
        lastMsgCount = 0;
        return;
    }

    const char = characters.find(c => c.id === activeCharId);
    data.history.forEach(m => renderMessage(m, char));
    lastMsgCount = data.history.length;
    container.scrollTop = container.scrollHeight;
}

// ── Render message ─────────────────────────────────────────────
function renderMessage(msg, char) {
    const container = document.getElementById("chat-messages");
    const empty = container.querySelector(".empty-state");
    if (empty) empty.remove();

    const isUser = msg.is_user;
    const time   = new Date(msg.created_at).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });

    const row = document.createElement("div");
    row.className = `message-row${isUser ? " message-row-user" : ""}`;

    if (isUser) {
        row.innerHTML = `
            <div>
                <div class="message-bubble message-bubble-user">${msg.content}</div>
                <div class="message-time" style="text-align:right;">${time}</div>
            </div>`;
    } else {
        const avatarContent = char && char.picture
            ? `<img src="${char.picture}" alt="${char.name}">`
            : (char ? char.name[0].toUpperCase() : "?");

        row.innerHTML = `
            <div class="message-avatar">${avatarContent}</div>
            <div>
                <div class="message-bubble">${msg.content}</div>
                <div class="message-time">${time}</div>
            </div>`;
    }

    container.appendChild(row);
    container.scrollTop = container.scrollHeight;
}

// ── Get auto message ───────────────────────────────────────────
async function getAutoMessage() {
    if (!activeTaskId) return;
    const btn = document.getElementById("auto-btn");
    if (btn) { btn.disabled = true; btn.textContent = "Thinking…"; }

    const res  = await fetch(`/api/tasks/${activeTaskId}/message`);
    const data = await res.json();

    const char = characters.find(c => c.id === activeCharId);
    renderMessage(data, char);
    showNotification(char.name, data.content);

    if (btn) { btn.disabled = false; btn.textContent = "📩 Prompt"; }
}

// ── Send reply ─────────────────────────────────────────────────
async function sendReply() {
    if (!activeTaskId) return;
    const input = document.getElementById("user-input");
    const text  = input ? input.value.trim() : "";
    if (!text) return;

    input.value    = "";
    input.disabled = true;

    const char = characters.find(c => c.id === activeCharId);

    const res  = await fetch(`/api/tasks/${activeTaskId}/reply`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ message: text })
    });
    const data = await res.json();

    renderMessage(data.user_message, char);
    renderMessage(data.reply, char);
    showNotification(char.name, data.reply.content);

    input.disabled = false;
    input.focus();
}

// ── Mark done ──────────────────────────────────────────────────
async function markDone() {
    if (!activeTaskId) return;
    const res = await fetch(`/api/tasks/${activeTaskId}/complete`, { method: "PATCH" });
    if (res.ok) selectCharacter(activeCharId);
}

// ── Clear messages ─────────────────────────────────────────────
function clearMessages() {
    document.getElementById("chat-messages").innerHTML = `
        <div class="empty-state">
            <div class="icon">📋</div>
            <p>No tasks yet. Add one from the sidebar.</p>
        </div>`;
    document.getElementById("task-tabs").innerHTML = "";
    document.getElementById("chat-input-area").innerHTML = "";
}

// ── Panel ──────────────────────────────────────────────────────
function openPanel(type) {
    editingCharId = null;
    editingTaskId = null;

    document.getElementById("panel-character").style.display = type === "character" ? "block" : "none";
    document.getElementById("panel-task").style.display      = type === "task"      ? "block" : "none";

    // Reset forms and buttons
    if (type === "character") {
        ["c-name","c-role","c-personality","c-picture"].forEach(id => document.getElementById(id).value = "");
        document.querySelector("#panel-character .btn-primary").textContent = "Create Character";
        document.querySelector("#panel-character .btn-primary").onclick = createCharacter;
        document.querySelector(".panel-title").textContent = "New Character";
    }

    if (type === "task") {
        renderCharacterSelector();
        ["t-name","t-description","t-deadline"].forEach(id => document.getElementById(id).value = "");
        document.getElementById("t-mpd").value = "3";
        document.querySelector("#panel-task .btn-primary").textContent = "Add Task";
        document.querySelector("#panel-task .btn-primary").onclick = createTask;
    }

    document.getElementById("side-panel").classList.add("open");
    document.getElementById("panel-backdrop").classList.add("open");
}

function closePanel() {
    document.getElementById("side-panel").classList.remove("open");
    document.getElementById("panel-backdrop").classList.remove("open");
}

// ── Character selector ─────────────────────────────────────────
function renderCharacterSelector() {
    const sel = document.getElementById("character-selector");
    sel.innerHTML = "";
    window._selectedCharId = activeCharId || (characters[0] ? characters[0].id : null);

    if (characters.length === 0) {
        sel.innerHTML = `<div style="color:var(--text-dim); font-size:0.85rem;">
            No characters yet — create one first.</div>`;
        return;
    }

    characters.forEach(c => {
        const avatarContent = c.picture
            ? `<img src="${c.picture}" alt="${c.name}">`
            : c.name[0].toUpperCase();

        const chip = document.createElement("div");
        chip.className = `char-chip${c.id === window._selectedCharId ? " selected" : ""}`;
        chip.id = `chip-${c.id}`;
        chip.onclick = () => {
            document.querySelectorAll(".char-chip").forEach(ch => ch.classList.remove("selected"));
            chip.classList.add("selected");
            window._selectedCharId = c.id;
        };
        chip.innerHTML = `
            <div class="char-chip-avatar">${avatarContent}</div>
            <div>
                <div class="char-chip-name">${c.name}</div>
                <div class="char-chip-role">${c.role}</div>
            </div>
        `;
        sel.appendChild(chip);
    });
}

// ── Create character ───────────────────────────────────────────
async function createCharacter() {
    const name        = document.getElementById("c-name").value.trim();
    const role        = document.getElementById("c-role").value.trim();
    const personality = document.getElementById("c-personality").value.trim();
    const picture     = document.getElementById("c-picture").value.trim();

    if (!name || !role || !personality) { alert("Name, role, and personality are required."); return; }

    const res = await fetch("/api/characters", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ name, role, personality, picture })
    });

    const data = await res.json();
    if (!res.ok) { alert(data.error || "Something went wrong."); return; }

    closePanel();
    await loadCharacters();
    selectCharacter(data.id);
}

// ── Create task ────────────────────────────────────────────────
async function createTask() {
    const charId      = window._selectedCharId;
    const name        = document.getElementById("t-name").value.trim();
    const description = document.getElementById("t-description").value.trim();
    const deadline    = document.getElementById("t-deadline").value;
    const mpd         = parseInt(document.getElementById("t-mpd").value);

    if (!charId) { alert("Please select a character."); return; }
    if (!name || !description || !deadline) { alert("All fields are required."); return; }

    const res = await fetch(`/api/characters/${charId}/tasks`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ name, description, deadline, messages_per_day: mpd })
    });

    const data = await res.json();
    if (!res.ok) { alert(data.error || "Something went wrong."); return; }

    closePanel();
    selectCharacter(charId);
}

// ── Poll ───────────────────────────────────────────────────────
async function poll() {
    if (!activeTaskId) return;
    const res  = await fetch(`/api/tasks/${activeTaskId}/history`);
    const data = await res.json();

    if (data.history.length > lastMsgCount && lastMsgCount !== 0) {
        const char   = characters.find(c => c.id === activeCharId);
        const newest = data.history[data.history.length - 1];
        if (!newest.is_user) {
            renderMessage(newest, char);
            showNotification(char.name, newest.content);
        }
    }
    lastMsgCount = data.history.length;
}

// ── Notification ───────────────────────────────────────────────
function showNotification(name, message) {
    const notif = document.getElementById("notification");
    document.getElementById("notification-name").textContent = name;
    document.getElementById("notification-text").textContent =
        message.length > 90 ? message.slice(0, 90) + "…" : message;
    notif.classList.add("show");
    setTimeout(() => notif.classList.remove("show"), 4500);
}
</script>
